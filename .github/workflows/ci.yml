name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

permissions:
  contents: read

jobs:
  build-lint-test:
    strategy:
      fail-fast: false
      matrix:
        # TODO(cretz): Enable ubuntu-24.04-arm when setup-ruby-and-rust supports it, see
        # https://github.com/oxidize-rb/actions/issues/53
        # 
        # TODO(cretz): Enable x64-mingw-ucrt if we can figure out Windows issue, see
        # https://github.com/temporalio/sdk-ruby/issues/172
        os: [ubuntu-latest, macos-latest]
        # Earliest and latest supported
        rubyVersion: ["3.3", "4.0"]
        # Opt-in FIPS build (aws-lc-rs); Linux only, the aws-lc-rs FIPS toolchain is not exercised on macOS.
        fips: [false, true]

        exclude:
          - os: macos-latest
            fips: true

        include:
          - os: ubuntu-latest
            rubyVersion: "4.0"
            fips: false
            checkTarget: true
            docsTarget: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Read protoc version
        shell: bash
        run: echo "PROTOC_VERSION=$(tr -d '\n' < .protoc-version)" >> "$GITHUB_ENV"

      - name: Setup Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: ${{ matrix.rubyVersion }}
          bundler-cache: true
          cargo-cache: true
          working-directory: ./temporalio

      # Needed for tests currently
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Install protoc-gen-rbi
        shell: bash
        run: |
          go install "github.com/coinbase/protoc-gen-rbi@$(tr -d '\n' < .protoc-gen-rbi-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bundle
        working-directory: ./temporalio
        run: bundle install

      - name: Check generated protos
        if: ${{ matrix.checkTarget }}
        working-directory: ./temporalio
        run: |
          bundle exec rake proto:check_generated

      - name: Assert FIPS build links the validated aws-lc-rs module and not ring
        if: ${{ matrix.fips }}
        working-directory: ./temporalio
        run: |
          fips_tree() {
            cargo tree -p temporalio_bridge --no-default-features --features fips -i "$1" 2>/dev/null
          }

          # The FIPS 140-3 validated module must actually be linked.
          if [ -z "$(fips_tree aws-lc-fips-sys)" ]; then
            echo "::error::aws-lc-fips-sys is absent from the FIPS dependency tree — the FIPS-validated module is not linked"
            exit 1
          fi
          echo "aws-lc-fips-sys is present in the FIPS dependency tree"

          # ring (non-FIPS) must not be linked.
          if [ -n "$(fips_tree ring)" ]; then
            echo "::error::ring is present in the FIPS dependency tree — TLS is not fully aws-lc-rs backed"
            exit 1
          fi
          echo "ring is absent from the FIPS dependency tree"

      - name: Lint, compile, test Ruby
        working-directory: ./temporalio
        # Timeout just in case there's a hanging part in rake
        timeout-minutes: 20
        # Set env vars for cloud tests. If secrets aren't present, tests will be skipped.
        env:
          # Selects the FIPS-mode aws-lc-rs crypto backend for the `fips: true` matrix legs.
          TEMPORALIO_FIPS: ${{ matrix.fips && '1' || '' }}

          # For mTLS tests
          TEMPORAL_CLOUD_MTLS_TEST_TARGET_HOST: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}.tmprl.cloud:7233
          TEMPORAL_CLOUD_MTLS_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_MTLS_TEST_CLIENT_CERT: ${{ secrets.TEMPORAL_CLIENT_CERT }}
          TEMPORAL_CLOUD_MTLS_TEST_CLIENT_KEY: ${{ secrets.TEMPORAL_CLIENT_KEY }}

          # For API key tests
          TEMPORAL_CLOUD_API_KEY_TEST_TARGET_HOST: ca-central-1.aws.api.temporal.io:7233
          TEMPORAL_CLOUD_API_KEY_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_API_KEY_TEST_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}

          # For cloud ops tests
          TEMPORAL_CLOUD_OPS_TEST_TARGET_HOST: saas-api.tmprl.cloud:443
          TEMPORAL_CLOUD_OPS_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_OPS_TEST_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLOUD_OPS_TEST_API_VERSION: 2024-05-13-00

        run: bundle exec rake TESTOPTS="--verbose"

      - name: Test Ruby with Sorbet runtime assertions
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: ./temporalio
        # Timeout just in case there's a hanging part in rake
        timeout-minutes: 10
        # Set env vars for cloud tests. If secrets aren't present, tests will be skipped.
        env:
          # For mTLS tests
          TEMPORAL_CLOUD_MTLS_TEST_TARGET_HOST: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}.tmprl.cloud:7233
          TEMPORAL_CLOUD_MTLS_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_MTLS_TEST_CLIENT_CERT: ${{ secrets.TEMPORAL_CLIENT_CERT }}
          TEMPORAL_CLOUD_MTLS_TEST_CLIENT_KEY: ${{ secrets.TEMPORAL_CLIENT_KEY }}

          # For API key tests
          TEMPORAL_CLOUD_API_KEY_TEST_TARGET_HOST: ca-central-1.aws.api.temporal.io:7233
          TEMPORAL_CLOUD_API_KEY_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_API_KEY_TEST_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}

          # For cloud ops tests
          TEMPORAL_CLOUD_OPS_TEST_TARGET_HOST: saas-api.tmprl.cloud:443
          TEMPORAL_CLOUD_OPS_TEST_NAMESPACE: ${{ vars.TEMPORAL_CLIENT_NAMESPACE }}
          TEMPORAL_CLOUD_OPS_TEST_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLOUD_OPS_TEST_API_VERSION: 2024-05-13-00

          # Enable Sorbet runtime type checking to verify RBI accuracy.
          TEMPORAL_SORBET_RUNTIME_CHECK: "1"

        run: bundle exec rake test TESTOPTS="--verbose"

      - name: Deploy docs
        # Only deploy on main merge, not in PRs
        if: ${{ github.ref == 'refs/heads/main' && matrix.docsTarget }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel deploy temporalio/doc --token ${{ secrets.VERCEL_TOKEN }} --prod --yes

  cloud-test:
    # Secrets are unavailable to workflows from forks.
    if: ${{ (github.event.pull_request.head.repo.full_name == '' || github.event.pull_request.head.repo.full_name == 'temporalio/sdk-ruby') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEMPORAL_TEST_ENV_CONFIG_SERVER: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Read protoc version
        shell: bash
        run: echo "PROTOC_VERSION=$(tr -d '\n' < .protoc-version)" >> "$GITHUB_ENV"

      - name: Setup Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cargo-cache: true
          working-directory: ./temporalio

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bundle
        working-directory: ./temporalio
        run: bundle install

      - name: Compile Ruby bridge
        working-directory: ./temporalio
        run: bundle exec rake compile

      - name: Generate Cloud test certificates
        run: |
          cert_dir="$RUNNER_TEMP/cloud-test-certs"
          mkdir "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.pem" \
            -subj '/CN=Temporal Ruby SDK Cloud CI CA'
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$cert_dir/client.key" -out "$cert_dir/client.csr" \
            -subj '/CN=Temporal Ruby SDK Cloud CI'
          openssl x509 -req -days 1 -in "$cert_dir/client.csr" \
            -CA "$cert_dir/ca.pem" -CAkey "$cert_dir/ca.key" -CAcreateserial \
            -out "$cert_dir/client.pem" -extfile <(printf 'extendedKeyUsage=clientAuth')
          {
            echo "TEMPORAL_CLOUD_CLIENT_CA_PATH=$cert_dir/ca.pem"
            echo "TEMPORAL_TLS_CLIENT_CERT_PATH=$cert_dir/client.pem"
            echo "TEMPORAL_TLS_CLIENT_KEY_PATH=$cert_dir/client.key"
          } >> "$GITHUB_ENV"

      - name: Create Cloud namespace
        id: create-cloud-namespace
        working-directory: ./temporalio
        run: bundle exec ruby ../.github/scripts/cloud_namespace.rb create
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLIENT_CLOUD_API_VERSION: v0.19.1

      - name: Test Ruby against Temporal Cloud
        working-directory: ./temporalio
        timeout-minutes: 15
        env:
          TEMPORAL_ADDRESS: ${{ steps.create-cloud-namespace.outputs.address }}
          TEMPORAL_NAMESPACE: ${{ steps.create-cloud-namespace.outputs.namespace }}
        run: bundle exec rake test TEST=test/worker_workflow_test.rb TESTOPTS="--name=/WorkerWorkflowTest#test_simple/"

      - name: Delete Cloud namespace
        if: ${{ always() && steps.create-cloud-namespace.outputs.namespace_name != '' }}
        working-directory: ./temporalio
        run: bundle exec ruby ../.github/scripts/cloud_namespace.rb delete "${{ steps.create-cloud-namespace.outputs.namespace }}" "${{ steps.create-cloud-namespace.outputs.namespace_name }}"
        env:
          TEMPORAL_CLIENT_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLIENT_CLOUD_API_KEY }}
          TEMPORAL_CLIENT_CLOUD_API_VERSION: v0.19.1
