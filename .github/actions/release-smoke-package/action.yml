name: Release package smoke test
description: >
  Install a published `temporalio` gem at a specific version from
  rubygems.org and run a minimal workflow to verify the install works.

inputs:
  version:
    description: "Gem version to install."
    required: true
  ruby-version:
    description: "Ruby version for the install and smoke test."
    required: false
    default: "3.4"

runs:
  using: composite
  steps:
    - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false
        cargo-cache: false

    - name: Install gem and run workflow smoke test
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ruby ./temporalio/smoke_test/smoke_test_gem.rb --version "$VERSION"
