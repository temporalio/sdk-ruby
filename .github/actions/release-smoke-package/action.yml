name: Smoke test released package
description: >
  Install a published `temporalio` gem at a specific version from
  rubygems.org and run a minimal workflow to verify the install works.

inputs:
  version:
    description: "Gem version to install."
    required: true
  ruby-version:
    description: "Ruby version for the install and smoke test."
    required: false
    default: "3.4"

runs:
  using: composite
  steps:
    - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false
        cargo-cache: false

    # Rubygems visibility can differ by runner, so each smoke-test runner waits itself.
    - name: Wait for version in compact-index
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + 1500 )) # 25 minutes
        version_re="^${VERSION//./\\.}[ -]"
        url="https://index.rubygems.org/info/temporalio"
        while true; do
          body=$(curl -fsSL "$url" 2>/dev/null || true)
          if echo "$body" | grep -qE "$version_re"; then
            echo "temporalio $VERSION visible in compact-index"
            exit 0
          fi
          if [[ $(date +%s) -ge $deadline ]]; then
            echo "Timed out waiting for temporalio $VERSION in compact-index" >&2
            exit 1
          fi
          echo "Not yet in compact-index; sleeping 15s..."
          sleep 15
        done

    - name: Install gem and run workflow smoke test
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ruby ./temporalio/smoke_test/smoke_test_gem.rb --version "$VERSION"
